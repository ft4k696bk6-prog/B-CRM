name: Fix review form notes

on:
  push:
    branches:
      - fix/review-form-notes-only
    paths:
      - .github/workflows/fix-review-form-notes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-form-notes-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch form note logic
        shell: python
        run: |
          from pathlib import Path
          import re

          import_file = Path('lib/google-sheets-lead-import.ts')
          text = import_file.read_text()
          replacement = r'''function questionLabel(value: string) {
            const trimmed = value.trim().replace(/^\uFEFF/, "");
            return trimmed.includes("_") ? trimmed.replace(/_+/g, " ") : trimmed;
          }

          function answerLabel(value: string) {
            return value.replace(/_+/g, " ").replace(/\s+/g, " ").trim();
          }

          function isReviewForm(formName: string | null, campaign: string | null) {
            const source = `${formName || ""} ${campaign || ""}`
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "");
            return source.includes("przegl");
          }

          function formNoteFromRow(row: SheetRow, formName: string | null, campaign: string | null) {
            if (!isReviewForm(formName, campaign)) return null;

            const answers = Object.entries(row)
              .filter(([column, rawValue]) => {
                const value = String(rawValue || "").trim();
                const normalized = normalizeColumnName(column);
                return Boolean(value)
                  && !META_FORM_COLUMNS.has(normalized)
                  && !["inbox_url", "lead_status", "priority", "created", "created_at", "updated", "updated_at", "status"].includes(normalized)
                  && !normalized.startsWith("utm_")
                  && normalized !== "fbclid"
                  && normalized !== "gclid"
                  && !value.startsWith("<test lead:");
              })
              .slice(0, 40)
              .map(([column, rawValue]) => `${questionLabel(column)} - ${answerLabel(String(rawValue || "")).slice(0, 1000)}`);

            if (!answers.length) return null;

            return [
              "Odpowiedzi z formularza:",
              ...answers
            ].join("\n").slice(0, 12000);
          }
          '''
          pattern = r'function questionLabel\(value: string\) \{.*?\n\}\n\nfunction formNoteFromRow\(row: SheetRow, formName: string \| null, campaign: string \| null\) \{.*?\n\}\n(?=\nfunction csvUrl)'
          text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'lead import patch matched {count} blocks')
          import_file.write_text(text)

          backfill_file = Path('lib/google-sheets-form-note-backfill.ts')
          text = backfill_file.read_text()
          replacement = r'''function formNoteFromRow(row: SheetRow) {
            const formName = String(row.form_name || "").trim() || null;
            const campaign = friendlyCampaign(String(row.campaign_name || "").trim() || null);
            const source = `${formName || ""} ${campaign || ""}`
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "");

            if (!source.includes("przegl")) return null;

            const answers = Object.entries(row)
              .filter(([column, rawValue]) => {
                const value = String(rawValue || "").trim();
                const normalized = normalizeColumnName(column);
                return Boolean(value)
                  && !META_FORM_COLUMNS.has(normalized)
                  && !["created", "created_at", "updated", "updated_at", "status"].includes(normalized)
                  && !normalized.startsWith("utm_")
                  && normalized !== "fbclid"
                  && normalized !== "gclid"
                  && !value.startsWith("<test lead:");
              })
              .slice(0, 40)
              .map(([column, rawValue]) => `${prettify(column)} - ${prettify(String(rawValue || "")).slice(0, 1000)}`);

            if (!answers.length) return null;

            return [
              "Odpowiedzi z formularza:",
              ...answers
            ].join("\n").slice(0, 12000);
          }
          '''
          pattern = r'function formNoteFromRow\(row: SheetRow\) \{.*?\n\}\n(?=\nasync function googleAccessToken)'
          text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'backfill patch matched {count} blocks')
          backfill_file.write_text(text)

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "ChatGPT patch"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-review-form-notes.yml
          git add lib/google-sheets-lead-import.ts lib/google-sheets-form-note-backfill.ts
          git commit -m "Limit form answer notes to review leads"
          git push origin HEAD:fix/review-form-notes-only
