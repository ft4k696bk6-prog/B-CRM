name: One-shot fix EMS pricing

on:
  push:
    paths:
      - ".github/one-shot-fix-ems.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove EMS surcharge and price label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/calculators/page.tsx')
          s = p.read_text()
          before = s
          s = s.replace('const EMS_NET_PRICE = 3000;\n', '')
          s = s.replace('      (ems ? EMS_NET_PRICE : 0) +\n', '')
          s = s.replace('                  <Toggle label="EMS (+3 000 zł netto)" checked={ems} onChange={setEms} />', '                  <Toggle label="EMS" checked={ems} onChange={setEms} />')
          if s == before:
              raise SystemExit('Expected EMS source patterns were not found or already changed')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/calculators/page.tsx
          git commit -m "Remove EMS surcharge from calculator"
          git push
