name: Apply dashboard team stats fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_dashboard_team_fix.py
      - .github/workflows/apply-dashboard-team-and-remove-equipment.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_dashboard_team_fix.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: count full team leads and remove equipment module"
          git push origin HEAD:main
